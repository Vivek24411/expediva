<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14120F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!--
      Loaded async: as a plain stylesheet this blocked first render for ~870ms.
      `display=swap` means text paints immediately in the fallback face.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      The home hero is the LCP candidate on "/", so start fetching it with the HTML.
      These URLs must match what lib/image.ts emits character for character, or the
      browser treats them as different resources and downloads the hero twice.
    -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1920&amp;q=62"
      imagesrcset="
        https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=480&amp;q=62 480w,
        https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=768&amp;q=62 768w,
        https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1024&amp;q=62 1024w,
        https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1440&amp;q=62 1440w,
        https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1920&amp;q=62 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <title>Expediva — Student trips from IIT Roorkee</title>
    <meta
      name="description"
      content="Expediva plans treks, weekend getaways and long tours for college students. Student pricing, verified stays, and a trip captain on every departure."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
